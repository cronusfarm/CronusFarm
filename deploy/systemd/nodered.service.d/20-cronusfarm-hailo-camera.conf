[Service]
# Node-RED 기동 후 카메라 미기동 시에만 start (매번 restart → 영상 끊김·8080 경합)
ExecStartPost=-/bin/sh -c 'systemctl is-active --quiet cronusfarm-ustreamer || systemctl start cronusfarm-ustreamer.service; systemctl is-active --quiet cronusfarm-hailo-stream || systemctl start cronusfarm-hailo-stream.service'
