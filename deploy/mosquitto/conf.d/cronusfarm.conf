# CronusFarm Mosquitto drop-in (/etc/mosquitto/conf.d/cronusfarm.conf 로 복사)
# - LAN·Tailscale 등 모든 IPv4 인터페이스에서 수신
# - log_dest / log_type 은 Debian 기본 /etc/mosquitto/mosquitto.conf 에 있음 → 여기 중복 금지
# - 적용: sudo bash scripts/pi-mosquitto-apply-cronusfarm-conf.sh
# - 외부 포워딩 51883 → 라우터에서 내부 1883 으로 넘기면 R4 LAN 은 1883 그대로 사용

listener 1883 0.0.0.0
allow_anonymous true
