# Tailscale MagicDNS 전용 HTTPS (Let's Encrypt 인증서와 SNI 분리)
# cronusfarm.duckdns.org 는 certbot 이 동일 파일의 기본 server 블록에 ssl 을 붙임.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name ida.mango-larch.ts.net;

  ssl_certificate     /etc/nginx/ssl/tailscale/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/tailscale/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  client_max_body_size 20m;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  location / {
    proxy_pass http://127.0.0.1:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
