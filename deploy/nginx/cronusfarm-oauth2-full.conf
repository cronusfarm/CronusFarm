# Google OAuth (oauth2-proxy) — server {} 안 include 전용
# CSRF: /oauth2/* 는 전부 4180으로 (sign_in nginx 우회 금지)
location /oauth2/ {
  proxy_pass http://127.0.0.1:4180;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header Connection "";
  proxy_buffering off;
}

location = /oauth2/auth {
  proxy_pass http://127.0.0.1:4180/oauth2/auth;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Uri $request_uri;
  proxy_set_header Content-Length "";
  proxy_pass_request_body off;
}

# 미로그인 시 oauth2-proxy /oauth2/start 로 (sign_in 이중 리다이렉트 제거)
location @oauth2_sign_in {
  return 302 /oauth2/start?rd=$scheme://$host$request_uri;
}
