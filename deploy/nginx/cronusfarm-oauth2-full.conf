# Google OAuth (oauth2-proxy) — server {} 안 include 전용
# CSRF: /oauth2/* 는 전부 4180으로 (sign_in nginx 우회 금지)
# X-Forwarded-Proto: $cf_forwarded_proto (실제 접속 스킴 — HTTP 우선)
location /oauth2/ {
  proxy_pass http://127.0.0.1:4180;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header Connection "";
  proxy_buffering off;
}

# LAN·Tailscale·내부 IP: auth_request 빈 URI 방지(500) — OAuth 생략
location = /oauth2/auth_skip {
  internal;
  return 204;
}

location = /oauth2/auth {
  proxy_pass http://127.0.0.1:4180/oauth2/auth;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Uri $request_uri;
  proxy_set_header Content-Length "";
  proxy_pass_request_body off;
}

# 미로그인 시 oauth2-proxy /oauth2/start
location @oauth2_sign_in {
  return 302 /oauth2/start?rd=$cf_oauth_rd_scheme://$host$request_uri;
}
