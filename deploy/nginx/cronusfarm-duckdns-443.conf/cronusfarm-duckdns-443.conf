# DuckDNS HTTPS — certbot 인증서로 443 접속 후 기존 HTTP(80) 블록으로 프록시
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name cronusfarm.duckdns.org;

  ssl_certificate     /etc/letsencrypt/live/cronusfarm.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cronusfarm.duckdns.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  client_max_body_size 20m;
  proxy_read_timeout 86400s;
  proxy_send_timeout 86400s;

  include /etc/nginx/cronusfarm-auth.conf;
  include /etc/nginx/cronusfarm-oauth2.conf;

  location / {
    proxy_pass http://127.0.0.1:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
