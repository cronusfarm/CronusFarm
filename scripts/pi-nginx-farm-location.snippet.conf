# CronusFarm — nginx 에 포함할 location 블록 (예시)
#
# 증상: curl http://127.0.0.1:1880/farm/cronusfarm/telegram-ping → nginx 404
# 원인: 1880 이 nginx 이고, Node-RED 의 http in(/farm/...) 은 **다른 포트**에서 받는 경우가 많음(FlowFuse 등).
#
# 1) Pi 에서 Node-RED 가 실제로 HTTP 를 여는 포트 확인:
#    ss -tlnp | grep -iE 'node|188'
#    grep -E 'uiPort|PORT' ~/.node-red/settings.js
#
# 2) 아래 PORT 를 위에서 확인한 값으로 바꿉니다 (예: 1881, 2880 등 — 환경마다 다름).
#
# 3) nginx 설정의 server { ... } 안 server_name / listen 이 맞는 블록에 붙입니다.
#    sudo nginx -t && sudo systemctl reload nginx
#
# 주의: proxy_pass 의 포트만 바꾸고, location 경로는 /farm/ 유지 (플로우의 http in URL 과 일치).

location ^~ /farm/ {
    proxy_pass http://127.0.0.1:PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
