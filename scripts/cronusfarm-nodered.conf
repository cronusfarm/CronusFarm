# =============================================================================
# CronusFarm Pi 앞단 nginx — 이 파일은 "브라우저 한 진입점(80·1880)" 역할을 유지한다.
# - listen 80 default_server, 1880 default_server (+ IPv6): pi-nginx-apply-cronusfarm.sh 가 sites-enabled/default 제거
# - location = / → 301 /ui/ : 루트 접속은 대시보드로
# - /ui, /admin, /nrdb2 → 1882 Node-RED (WebSocket 헤더 유지)
# - /farm/ → 1882 (http in API 등); /farm/ai-mjpeg/video_feed 만 ustreamer(8080/stream) — UVC 단일 점유
# - /cronusfarm-static/ → 저장소 dashboard 정적 파일(alias 경로는 Pi 사용자와 맞출 것)
# 경로·업스트림 포트를 바꿀 때는 대시보드·카메라·스케줄 API를 함께 검증할 것.
# =============================================================================
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Google OAuth: 공개 DuckDNS만. Tailscale(*.ts.net)·LAN은 Tailscale VPN 인증만( auth_request 생략 )
map $host $cf_oauth_auth_uri {
  cronusfarm.duckdns.org /oauth2/auth;
  default /oauth2/auth_skip;
}

# OAuth CSRF: DuckDNS는 브라우저가 https 로 접속 → oauth2 에도 https 로 전달
map $http_x_forwarded_proto $cf_xfp_fallback {
  default $http_x_forwarded_proto;
  ''      $scheme;
}
map $host $cf_forwarded_proto {
  cronusfarm.duckdns.org https;
  default $cf_xfp_fallback;
}
map $host $cf_oauth_rd_scheme {
  cronusfarm.duckdns.org https;
  default $scheme;
}

server {
  # 표준 HTTP(80)·1880 — pi-nginx-apply-cronusfarm.sh 가 sites-enabled/default 제거 후 이 블록만 default_server
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 1880 default_server;
  listen [::]:1880 default_server;
  server_name _;

  # 대용량 플로우 배포(POST /admin/flows) 시 기본 1m 제한·짧은 업스트림 타임아웃이 502로 이어질 수 있음
  client_max_body_size 20m;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  # AI 카메라 MJPEG — 원본: ustreamer 8080 (UVC 단일 점유)
  location = /farm/ai-mjpeg/video_feed {
    proxy_pass http://127.0.0.1:8080/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Hailo 오버레이 MJPEG — ustreamer 8080 입력 → Hailo 추론 → 8081/video_feed
  location = /farm/hailo-mjpeg/detect_now {
    proxy_pass http://127.0.0.1:8081/detect_now;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /farm/hailo-mjpeg/video_feed {
    proxy_pass http://127.0.0.1:8081/video_feed;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # 선택 로그인: scripts/pi-nginx-set-basic-auth.sh → /etc/nginx/cronusfarm-auth.conf
  include /etc/nginx/cronusfarm-auth.conf;
  # Google OAuth (선택): pi-install-oauth2-proxy-google.sh 가 oauth2·auth_request 적용
  include /etc/nginx/cronusfarm-oauth2.conf;

  # CronusFarm 설정 SPA (Vite base=/farm/ui/, hash 라우터) — DuckDNS: OAuth + 이메일 헤더
  location ^~ /farm/ui/assets/ {
    auth_request /oauth2/auth;
    error_page 401 403 = @oauth2_sign_in;
    alias /home/dooly/CronusFarm/farm-ui/dist/assets/;
    add_header Cache-Control "no-cache, must-revalidate";
    access_log off;
  }
  location ^~ /farm/ui/ {
    auth_request /oauth2/auth;
    error_page 401 403 = @oauth2_sign_in;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    auth_request_set $auth_user $upstream_http_x_auth_request_user;
    add_header X-Auth-User $auth_email;
    alias /home/dooly/CronusFarm/farm-ui/dist/;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    access_log off;
  }
  location = /farm/ui/ {
    auth_request /oauth2/auth;
    error_page 401 403 = @oauth2_sign_in;
    rewrite ^ /farm/ui/index.html last;
    access_log off;
  }
  location = /farm/ui {
    return 301 /farm/ui/;
  }

  # SQLite 브리지 tele 적재 — R4·내부 LAN, OAuth 없음(ingest 전용)
  location ^~ /farm/cronusfarm-sqlite/ingest/ {
    proxy_pass http://127.0.0.1:18766/ingest/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # SQLite 브리지(18766) — SPA·관리 API (OAuth 이메일 → /api/admin/me)
  location ^~ /farm/cronusfarm-sqlite/ {
    auth_request /oauth2/auth;
    error_page 401 403 = @oauth2_sign_in;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    auth_request_set $auth_user $upstream_http_x_auth_request_user;
    proxy_pass http://127.0.0.1:18766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Email $auth_email;
    proxy_set_header X-Auth-Request-Email $auth_email;
    proxy_set_header X-Auth-Request-User $auth_user;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # CronusFarm http in (스케줄 API 프록시·telegram-ping 등) → 작업용 Node-RED
  location ^~ /farm/ {
    proxy_pass http://127.0.0.1:1882;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
  location = /farm { return 301 /farm/; }

  # CronusFarm 정적(JS/HTML): NR httpStatic 이 404일 때도 동일 경로로 제공(Chart.js·대시보드 HTML)
  # deploy 기본 RemoteCronusRoot=/home/dooly/CronusFarm 과 맞춤 — 사용자명 다르면 이 alias 경로 수정
  location ^~ /cronusfarm-static/ {
    alias /home/dooly/CronusFarm/nodered/dashboard/;
    access_log off;
  }

  # 스냅샷 내부 경로(ui05/ui07)는 외부 접근 차단(항상 /ui/v0.x 로만 접근)
  location ^~ /ui05/ { return 404; }
  location = /ui05 { return 404; }
  location ^~ /ui07/ { return 404; }
  location = /ui07 { return 404; }

  # Tailscale(.ts.net): 443 SSL 미구동 시 HTTPS 리다이렉트 금지(접속 불가 원인).
  # LAN OAuth/HTTPS 는 별도 server 블록(cronusfarm-oauth2-full.conf)에서만 사용.

  # 루트(/) → 모니터 NR Dashboard (/ui/)
  location = / { return 301 /ui/; }

  # 작업용(최신) - 1882
  location ^~ /admin/ {
    proxy_pass http://127.0.0.1:1882/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
  }
  location = /admin { return 301 /admin/; }

  location ^~ /ui/ {
    include /etc/nginx/cronusfarm-auth.conf;
    proxy_pass http://127.0.0.1:1882/ui/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location = /ui { return 301 /ui/; }

  # Dashboard 1: 일부 환경에서 /ui/loading.html 요청이 404 — 대시보드 부트스트랩용 최소 HTML
  location = /ui/loading.html {
    default_type text/html;
    charset utf-8;
    return 200 '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title></title></head><body></body></html>';
  }

  # Dashboard 2(FlowFuse): ui-base path /nrdb2 — /ui 와 동일하게 업그레이드·WebSocket 헤더 유지
  location ^~ /nrdb2 {
    proxy_pass http://127.0.0.1:1882;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # v0.5 스냅샷 - 1881
  location ^~ /admin/v0.5/ {
    proxy_pass http://127.0.0.1:1881/admin/v0.5/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location = /admin/v0.5 { return 301 /admin/v0.5/; }

  location ^~ /ui/v0.5/ {
    proxy_pass http://127.0.0.1:1881/ui05/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location = /ui/v0.5 { return 301 /ui/v0.5/; }

  # v0.7 스냅샷 - 1883
  location ^~ /admin/v0.7/ {
    proxy_pass http://127.0.0.1:1884/admin/v0.7/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location = /admin/v0.7 { return 301 /admin/v0.7/; }

  location ^~ /ui/v0.7/ {
    proxy_pass http://127.0.0.1:1884/ui07/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location = /ui/v0.7 { return 301 /ui/v0.7/; }

  # 나머지(HTTP In API 등)는 작업용 Node-RED(httpNodeRoot='/')로 전달
  location / {
    proxy_pass http://127.0.0.1:1882;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
